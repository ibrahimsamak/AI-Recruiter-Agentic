<svg xmlns="http://www.w3.org/2000/svg" width="900" height="620" viewBox="0 0 900 620" font-family="'Segoe UI', Helvetica, Arial, sans-serif">
  <defs>
    <marker id="arrow" markerWidth="10" markerHeight="10" refX="6" refY="3" orient="auto" markerUnits="strokeWidth">
      <path d="M0,0 L6,3 L0,6 Z" fill="#64748b"/>
    </marker>
  </defs>

  <rect x="0" y="0" width="900" height="620" rx="14" fill="#ffffff" stroke="#e2e8f0"/>

  <!-- title band -->
  <rect x="0" y="0" width="900" height="60" rx="14" fill="#0f172a"/>
  <rect x="0" y="40" width="900" height="20" fill="#0f172a"/>
  <text x="450" y="30" text-anchor="middle" fill="#ffffff" font-size="22" font-weight="700">AI-Recruiter-Agentic</text>
  <text x="450" y="50" text-anchor="middle" fill="#94a3b8" font-size="12">agentic job discovery · ranking · tailoring · assisted apply — human in control</text>

  <!-- 1. UI -->
  <rect x="230" y="82" width="440" height="46" rx="9" fill="#f8fafc" stroke="#3b82f6" stroke-width="1.5"/>
  <text x="450" y="103" text-anchor="middle" fill="#0f172a" font-size="14" font-weight="700">Gradio Chat UI — streaming</text>
  <text x="450" y="119" text-anchor="middle" fill="#475569" font-size="11.5">upload résumé (PDF · DOCX · TXT)</text>
  <line x1="450" y1="128" x2="450" y2="150" stroke="#64748b" stroke-width="1.5" marker-end="url(#arrow)"/>

  <!-- 2. Orchestrator -->
  <rect x="150" y="152" width="600" height="150" rx="11" fill="#eef2ff" stroke="#6366f1" stroke-width="1.5"/>
  <text x="450" y="173" text-anchor="middle" fill="#312e81" font-size="14" font-weight="700">DeepAgents Orchestrator</text>
  <text x="450" y="190" text-anchor="middle" fill="#4338ca" font-size="11.5">plans with todos · applies the matching skill in-context · cannot submit (submit tools stripped)</text>

  <!-- subagents -->
  <rect x="172" y="205" width="270" height="82" rx="9" fill="#ffffff" stroke="#818cf8" stroke-width="1.3"/>
  <text x="307" y="226" text-anchor="middle" fill="#312e81" font-size="12.5" font-weight="700">discovery subagent</text>
  <text x="307" y="245" text-anchor="middle" fill="#475569" font-size="11">search_jobs (MCP)</text>
  <text x="307" y="262" text-anchor="middle" fill="#475569" font-size="11">JobSpy → LinkedIn</text>
  <text x="307" y="279" text-anchor="middle" fill="#94a3b8" font-size="10">isolates bulky postings</text>

  <rect x="458" y="205" width="270" height="82" rx="9" fill="#ffffff" stroke="#818cf8" stroke-width="1.3"/>
  <text x="593" y="226" text-anchor="middle" fill="#312e81" font-size="12.5" font-weight="700">tailoring_worker subagent</text>
  <text x="593" y="245" text-anchor="middle" fill="#475569" font-size="11">tailored résumé + cover letter</text>
  <text x="593" y="262" text-anchor="middle" fill="#475569" font-size="11">grounded · check_grounding</text>
  <text x="593" y="279" text-anchor="middle" fill="#94a3b8" font-size="10">spawned per job</text>

  <line x1="450" y1="302" x2="450" y2="324" stroke="#64748b" stroke-width="1.5" marker-end="url(#arrow)"/>

  <!-- 3. documents -->
  <rect x="230" y="326" width="440" height="46" rx="9" fill="#f8fafc" stroke="#3b82f6" stroke-width="1.5"/>
  <text x="450" y="347" text-anchor="middle" fill="#0f172a" font-size="14" font-weight="700">Ranked jobs + 📎 tailored documents</text>
  <text x="450" y="363" text-anchor="middle" fill="#475569" font-size="11.5">materialized to outputs/ · downloadable</text>
  <line x1="450" y1="372" x2="450" y2="394" stroke="#64748b" stroke-width="1.5" marker-end="url(#arrow)"/>

  <!-- 4. Model B -->
  <rect x="230" y="396" width="440" height="46" rx="9" fill="#ecfdf5" stroke="#10b981" stroke-width="1.5"/>
  <text x="450" y="417" text-anchor="middle" fill="#065f46" font-size="14" font-weight="700">Approve a job → open apply page</text>
  <text x="450" y="433" text-anchor="middle" fill="#047857" font-size="11.5">visible, logged-in Chromium (Playwright) opens the apply page</text>
  <line x1="450" y1="442" x2="450" y2="464" stroke="#64748b" stroke-width="1.5" marker-end="url(#arrow)"/>

  <!-- 5. human -->
  <rect x="230" y="466" width="440" height="46" rx="9" fill="#fff7ed" stroke="#f59e0b" stroke-width="1.5"/>
  <text x="450" y="487" text-anchor="middle" fill="#9a3412" font-size="14" font-weight="700">You review &amp; submit</text>
  <text x="450" y="503" text-anchor="middle" fill="#b45309" font-size="11.5">human-in-the-loop — the agent never submits</text>

  <!-- cross-cutting chips -->
  <text x="450" y="546" text-anchor="middle" fill="#64748b" font-size="11" font-weight="700">POWERED BY</text>
  <g font-size="11" font-weight="600">
    <rect x="70"  y="558" width="86"  height="26" rx="13" fill="#1e293b"/><text x="113" y="575" text-anchor="middle" fill="#fff">DeepAgents</text>
    <rect x="164" y="558" width="82"  height="26" rx="13" fill="#1e293b"/><text x="205" y="575" text-anchor="middle" fill="#fff">LangGraph</text>
    <rect x="254" y="558" width="84"  height="26" rx="13" fill="#1e293b"/><text x="296" y="575" text-anchor="middle" fill="#fff">LangChain</text>
    <rect x="346" y="558" width="52"  height="26" rx="13" fill="#1e293b"/><text x="372" y="575" text-anchor="middle" fill="#fff">MCP</text>
    <rect x="406" y="558" width="84"  height="26" rx="13" fill="#1e293b"/><text x="448" y="575" text-anchor="middle" fill="#fff">ChromaDB</text>
    <rect x="498" y="558" width="84"  height="26" rx="13" fill="#1e293b"/><text x="540" y="575" text-anchor="middle" fill="#fff">LangSmith</text>
    <rect x="590" y="558" width="60"  height="26" rx="13" fill="#1e293b"/><text x="620" y="575" text-anchor="middle" fill="#fff">Gradio</text>
    <rect x="658" y="558" width="62"  height="26" rx="13" fill="#1e293b"/><text x="689" y="575" text-anchor="middle" fill="#fff">JobSpy</text>
    <rect x="728" y="558" width="82"  height="26" rx="13" fill="#1e293b"/><text x="769" y="575" text-anchor="middle" fill="#fff">Playwright</text>
  </g>
</svg>
